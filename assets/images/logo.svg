<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="100" cy="100" r="90" fill="#E3F2FD" />

  <!-- Book Base Shadow Layer -->
  <path d="M 100 138 C 75 128, 45 131, 35 135 L 35 71 C 45 67, 75 64, 100 75 Z" fill="#90CAF9" opacity="0.4" />
  <path d="M 100 138 C 125 128, 155 131, 165 135 L 165 71 C 155 67, 125 64, 100 75 Z" fill="#90CAF9" opacity="0.4" />

  <!-- Book Left Page -->
  <path d="M 100 135 C 75 125, 45 128, 35 132 L 35 68 C 45 64, 75 61, 100 72 Z" fill="url(#bookGrad)" />
  
  <!-- Book Right Page -->
  <path d="M 100 135 C 125 125, 155 128, 165 132 L 165 68 C 155 64, 125 61, 100 72 Z" fill="url(#bookGrad)" />

  <!-- Book Center Spine -->
  <path d="M 98 70 L 102 70 L 102 137 L 98 137 Z" fill="#0D47A1" />

  <!-- Page details (lines) -->
  <path d="M 48 82 C 60 77, 80 77, 90 82" stroke="#BBDEFB" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 48 95 C 60 90, 80 90, 90 95" stroke="#BBDEFB" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 48 108 C 60 103, 80 103, 90 108" stroke="#BBDEFB" stroke-width="3" stroke-linecap="round" fill="none" />

  <path d="M 110 82 C 120 77, 140 77, 152 82" stroke="#BBDEFB" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 110 95 C 120 90, 140 90, 152 95" stroke="#BBDEFB" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 110 108 C 120 103, 140 103, 152 108" stroke="#BBDEFB" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Pen Body (Diagonal) -->
  <g transform="translate(10, -5)">
    <!-- Pen Nib -->
    <path d="M 92 125 L 100 145 L 108 125 Z" fill="#FFC107" />
    <circle cx="100" cy="132" r="1.5" fill="#5D4037" />
    <line x1="100" y1="132" x2="100" y2="145" stroke="#5D4037" stroke-width="1.5" />

    <!-- Pen Barrel -->
    <path d="M 92 125 L 94 48 C 94 44, 106 44, 106 48 L 108 125 Z" fill="url(#penGrad)" />

    <!-- Pen Clip & Ring -->
    <rect x="91" y="55" width="18" height="6" rx="2" fill="#FFD54F" />
    <path d="M 97 58 L 97 85 C 97 88, 101 88, 101 85 L 101 58 Z" fill="#FFA000" />
  </g>
</svg>
